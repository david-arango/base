<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base Budgeting App</title>
    <style>
      :root {
        --bg: #121826;
        --panel: #1e293b;
        --primary: #7dd3fc;
        --accent: #a78bfa;
        --text: #e2e8f0;
        --muted: #cbd5e1;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #0f172a);
        color: var(--text);
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 80px 24px;
      }

      .card {
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid rgba(125, 211, 252, 0.25);
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.45);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2.5rem, 5vw, 4rem);
        line-height: 1.1;
      }

      .highlight {
        color: var(--primary);
      }

      p {
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .pill {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 16px;
        background: rgba(167, 139, 250, 0.12);
        border: 1px solid rgba(167, 139, 250, 0.4);
        border-radius: 999px;
        color: var(--text);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Welcome to <span class="highlight">Base</span></h1>
        <p>
          Base is a budgeting app designed to help you manage money, track spending,
          and stay on top of your goals with a simple, focused experience.
        </p>
        <p>
          This page was added as the starter for GitHub Pages for the Base project.
        </p>
        <div class="pill">Base Budgeting App</div>
      </div>
    </div>
  </body>
</html>
